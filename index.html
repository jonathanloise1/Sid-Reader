<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sid - E-Book Reader</title>

    <!-- On-screen debug console (activate by adding ?debug=1 to the URL). -->
    <script>
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        if (params.get('debug') !== '1') return;
      } catch (e) { return; }

      var logs = [];
      function render() {
        var box = document.getElementById('__dbg');
        if (!box) return;
        box.textContent = logs.slice(-200).join('\n');
        box.scrollTop = box.scrollHeight;
      }
      function add(kind, args) {
        var parts = [];
        for (var i = 0; i < args.length; i++) {
          var a = args[i];
          try {
            parts.push(typeof a === 'object' ? JSON.stringify(a) : String(a));
          } catch (e) { parts.push(String(a)); }
        }
        logs.push('[' + kind + '] ' + parts.join(' '));
        render();
      }

      function mountUI() {
        if (document.getElementById('__dbg')) return;
        var box = document.createElement('pre');
        box.id = '__dbg';
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;margin:0;padding:8px;z-index:2147483647;background:rgba(0,0,0,.88);color:#0f0;font:11px/1.4 monospace;white-space:pre-wrap;word-break:break-word;border-top:2px solid #0f0;';
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;right:8px;bottom:calc(45vh + 6px);z-index:2147483647;display:flex;gap:6px;';
        var copy = document.createElement('button');
        copy.textContent = 'Copia';
        copy.style.cssText = 'padding:6px 10px;font:12px monospace;background:#0a0;color:#fff;border:0;border-radius:6px;';
        copy.onclick = function () {
          var t = logs.join('\n');
          if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){copy.textContent='Copiato!';},function(){});
          else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); copy.textContent='Copiato!'; }
        };
        bar.appendChild(copy);
        document.body.appendChild(bar);
        document.body.appendChild(box);
        render();
      }
      if (document.body) mountUI();
      else document.addEventListener('DOMContentLoaded', mountUI);

      window.onerror = function (msg, src, line, col, err) {
        add('JS-ERROR', [msg + ' @ ' + (src || '?') + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : '')]);
      };
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        add('PROMISE', [r && r.stack ? r.stack : (r && r.message ? r.message : String(r))]);
      });
      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.src || e.target.href)) {
          add('LOAD-FAIL', [(e.target.tagName || '?') + ' ' + (e.target.src || e.target.href)]);
        }
      }, true);

      ['log', 'warn', 'error', 'info'].forEach(function (k) {
        var orig = console[k] ? console[k].bind(console) : function () {};
        console[k] = function () { add(k.toUpperCase(), arguments); orig.apply(null, arguments); };
      });

      add('DEBUG', ['console attiva — UA: ' + navigator.userAgent]);
    })();
    </script>

    <!-- Bootstrap (self-hosted: no CDN dependency, works offline / behind blockers) -->
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />

    <!-- App styles - modular -->
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="core/reader.css" />
    <link rel="stylesheet" href="components/cover.css" />
    <link rel="stylesheet" href="components/lightbox.css" />
    <link rel="stylesheet" href="components/media-gallery.css" />
    <link rel="stylesheet" href="components/narrator.css" />
</head>
<body>
    <!-- Main content: Book reader -->
    <main role="main">
        <div class="reader-root" id="readerRoot">
            <!-- Splash / Preloader (minimal) -->
            <div id="splash" class="splash" aria-hidden="false">
                <div class="splash-inner">
                    <h2 id="splashTitle">Loading…</h2>
                    <div id="splashProgress" class="splash-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div id="splashBar" class="splash-bar"></div>
                    </div>
                    <!-- minimal splash: no extra info -->
                </div>
            </div>
            <!-- Responsive menu / TOC -->
            <aside id="sideMenu" class="side-menu">
                <div class="menu-header">
                    <h4 id="bookTitle">Story</h4>
                    <button id="menuClose" class="btn-close" aria-label="Close menu"></button>
                </div>
                <div class="menu-body">
                    <nav id="toc" class="toc-list" role="navigation" aria-label="Table of contents"></nav>
                </div>
            </aside>

            <!-- Book stage -->
            <section id="bookStage" class="book-stage" aria-live="polite">
                <div id="pages" class="pages"></div>
                <div id="paginationBar" class="pagination-bar" role="navigation" aria-label="Page navigation"></div>
            </section>

            <!-- ARIA live region for page announcements -->
            <div id="ariaLive" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

            <!-- Mobile top drawer trigger -->
            <button id="menuToggle" class="menu-toggle" aria-label="Open menu">☰</button>
        </div>
    </main>

    <!-- Floating Narrator Button -->
    <button id="narratorFab" class="narrator-fab" title="Ask the Narrator">💬</button>

    <!-- Narrator Panel -->
    <div id="narratorPanel" class="narrator-panel">
        <div class="resize-handle" id="resizeHandle"></div>
        <div class="narrator-header">
            <span>Narrator</span>
            <button id="closeNarrator" class="btn-close"></button>
        </div>
        <div class="narrator-body">
            <!-- Step 1: API Key -->
            <div id="apiKeyStep">
                <label for="apiKey" class="form-label">Enter your OpenAI API Key</label>
                <input type="password" id="apiKey" class="form-control mb-3" placeholder="sk-..." />
                <div class="d-flex gap-2">
                    <button id="btnEnableAI" class="btn btn-success flex-grow-1">Enable Narrator</button>
                    <button id="btnForgetKey" class="btn btn-outline-secondary">Forget Key</button>
                </div>
                <div id="apiKeyHint" class="form-text mt-2 text-muted">Your key is stored in session storage (cleared when you close the browser).</div>
            </div>

            <!-- Step 2: Chat -->
            <div id="chatStep" class="chat-box" style="display:none;">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input">
                    <textarea id="question" rows="1" placeholder="Ask about the story..."></textarea>
                    <button id="btnAsk" class="btn btn-success">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts - modular architecture -->

    <!-- Core utilities -->
    <script src="core/utils.js" defer></script>
    <script src="core/gestures.js" defer></script>
    
    <!-- Components -->
    <script src="components/media-gallery.js" defer></script>
    <script src="components/lightbox.js" defer></script>
    <script src="components/cover.js" defer></script>
    
    <!-- Core reader -->
    <script src="core/reader.js" defer></script>
    
    <!-- Story loader -->
    <script src="stories.reader.js" defer></script>
    
    <!-- agent.js is loaded on-demand (first narrator click) -->

        <script>
            // Register service worker if supported (client-only environment)
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    // Relative path so it works under a sub-path (e.g. GitHub Pages /Sid-Reader/)
                    navigator.serviceWorker.register('sw.js').catch(()=>{});
                });
            }
        </script>

    <script>
        window.ipfsGatewayBase = "https://ipfs.io";
        (function(){
          let agentLoading = false;
          const fab = document.getElementById('narratorFab');
          if (!fab) return;
          fab.addEventListener('click', function handler(e){
            if (window.agent || agentLoading) return; // already loaded or loading
            e.preventDefault();
            agentLoading = true;
            const s = document.createElement('script');
            s.src = 'agent.js';
            s.async = true;
            s.onload = () => {
              agentLoading = false;
              if (window.pendingNarrative && window.agent?.setNarrative) {
                try { window.agent.setNarrative(window.pendingNarrative); } catch {}
              }
              setTimeout(() => fab.click(), 0);
            };
            s.onerror = () => { agentLoading = false; console.error('Failed to load agent.js'); };
            document.body.appendChild(s);
          }, { capture: true, once: false });
        })();
    </script>
</body>
</html>
